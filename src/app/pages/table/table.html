<div class="container">
  <h1>Employee Dashboard</h1>
  <button nz-button nzType="primary" class="logout-button" (click)="getHome()">←  </button>
  <nz-space-compact>
    <input nz-input placeholder="Search by ID" class="search" [(ngModel)]="searchId"/>
    <button nz-button nzType="primary" class="search-button" (click)="onSearch()">Submit</button>
    <button nz-button (click)="refreshPage()" class="reload-button">Reload</button>
  </nz-space-compact>
  <nz-table #editRowTable nzBordered [nzData]="listOfData"  [nzFrontPagination]="true" [nzPageSize]="10" nzTableLayout="fixed" class="table-setting">
    <thead>
      <tr>
        <th>id</th>
        <th>Name</th>
        <th>Age</th>
        <th>Address</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (data of editRowTable.data; track data) {
        <tr>
          @if (!editCache[data.id].edit) {
            <td>{{data.id}}</td>
            <td>{{ data.name }}</td>
            <td>{{ data.age }}</td>
            <td>{{ data.address }}</td>
            <td><a (click)="startEdit(data.id)" class="update-settings">Edit</a><a nz-popconfirm nzPopconfirmTitle="Are you sure to delete?" (nzOnConfirm)="onDelete(data.id)" class="delete-settings"> Delete</a></td>
            
          } 
          @else {
              <td>{{ data.id }}</td>
              <td><input nz-input [(ngModel)]="editCache[data.id].data.name" /></td>
              <td><input nz-input type="number" [(ngModel)]="editCache[data.id].data.age" /></td>
              <td><input nz-input [(ngModel)]="editCache[data.id].data.address" /></td>
            <td>
              <a (click)="saveEdit(data.id)" class="save-button">Save</a>
              <a nz-popconfirm nzPopconfirmTitle="Sure to cancel?"
                (nzOnConfirm)="cancelEdit(data.id)"
                class="cancel-button">
                Cancel
              </a>
            </td>
          }
        </tr>
      }
  </tbody>
</nz-table>
<a class="add-button" (click)="addUser()">+</a>
</div>
